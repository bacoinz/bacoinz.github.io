<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#111014">
<meta property="og:title" content="Baco">
<meta property="og:description" content="A musician who does games and apps with the help of AI, for fun, for free.">
<meta property="og:image" content="https://bacoinz.github.io/img/baco.jpg">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!-- GitHub Pages caches files for 10 min, so CSS/JS are requested with a fresh query string on every load -->
<script>document.write('<link rel="stylesheet" href="styles.css?v='+Date.now()+'">')</script>
<noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>
<div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="en" aria-pressed="true">EN</button>
  <button type="button" data-lang="pt" aria-pressed="false">PT</button>
</div>

<main>
  <header class="hero wrap">
    <div class="hero-top">
      <img class="avatar" src="img/baco.jpg" width="170" height="170" alt="Portrait of Baco" data-i18n-alt="alt">
      <div class="hero-text">
        <h1><span class="hl">Baco</span></h1>
        <button class="tagline" id="tagline" aria-expanded="false" aria-controls="bio">
          <span data-i18n="tagline"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="bio" id="bio"><div class="bio-in">
          <p data-i18n="bio1"></p>
          <p data-i18n="bio2"></p>
          <p data-i18n="bio3"></p>
          <p data-i18n="bio4"></p>
        </div></div>
      </div>
    </div>

    <div class="hero-bottom">
      <a class="btn primary" href="https://ko-fi.com/bacoinz" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z"/><path d="M16 9h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M8 4v1M12 4v1"/></svg>
        <span data-i18n="kofi"></span>
      </a>
      <div class="socials">
        <div class="sg"><span class="eyebrow" data-i18n="social"></span><div class="row">
          <a class="ico" href="https://instagram.com/bacocenas" target="_blank" rel="noopener" aria-label="Instagram" data-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/></svg></a>
          <a class="ico" href="https://tiktok.com/@baco.music" target="_blank" rel="noopener" aria-label="TikTok" data-label="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.6 2 4.4 5 4.6"/></svg></a>
          <a class="ico" href="https://linktr.ee/bacomusic" target="_blank" rel="noopener" aria-label="Linktree" data-label="Linktree"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M12 8l5-4M12 8L7 4M12 13l6-4M12 13L6 9M12 18l4-3M12 18l-4-3"/></svg></a>
        </div></div>
        <div class="sg"><span class="eyebrow" data-i18n="music"></span><div class="row">
          <a class="ico" href="https://open.spotify.com/artist/2WZ0XP4dz6Y9nbMxymF0aA" target="_blank" rel="noopener" aria-label="Spotify" data-label="Spotify"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7 9.5c3.5-1 7-.7 10 1M7.5 12.5c3-.8 6-.5 8.5 1M8 15.3c2.4-.6 4.6-.4 6.5.7"/></svg></a>
          <a class="ico" href="https://soundcloud.com/bacocenas/" target="_blank" rel="noopener" aria-label="SoundCloud" data-label="SoundCloud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14v3M6 12v5M9 10v7M12 8v9"/><path d="M12 17h7a3.2 3.2 0 0 0 .4-6.4A5 5 0 0 0 12 9"/></svg></a>
          <a class="ico" href="https://www.youtube.com/@bacocenas" target="_blank" rel="noopener" aria-label="YouTube" data-label="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/></svg></a>
        </div></div>
      </div>
    </div>
  </header>

  <section class="projects wrap" id="projects">
    <div class="head">
      <div>
        <p class="eyebrow" data-i18n="open"></p>
        <h2 data-i18n-html="made"></h2>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-f="all" data-i18n="all"></button>
        <button role="tab" aria-selected="false" data-f="app" data-i18n="apps"></button>
        <button role="tab" aria-selected="false" data-f="game" data-i18n="games"></button>
      </div>
    </div>
    <div class="grid" id="grid" aria-live="polite"><p class="state" data-i18n="loading"></p></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span data-i18n="footer"></span>
    <a href="https://ko-fi.com/bacoinz" target="_blank" rel="noopener">Ko-fi</a>
  </div>
</footer>
<script>document.write('<script src="app.js?v='+Date.now()+'"><'+'/script>')</script>

</html>
